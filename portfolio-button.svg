<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="poBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C7B7"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>
    <linearGradient id="poShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="200 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="198" height="48" rx="10" fill="url(#poBg)"/>
  <rect x="1" y="1" width="198" height="48" rx="10" fill="url(#poShine)"/>
  <rect x="1" y="1" width="198" height="48" rx="10" fill="none" stroke="#003b36" stroke-opacity="0.4" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="100" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#00201d" text-anchor="middle">🌐 Portfolio</text>
</svg>
